name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate shell
        run: |
          bash -n install.sh
          shellcheck install.sh

      - name: Scan tracked files for credential patterns
        run: |
          if git grep -nE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ghp_[[:alnum:]]{20,}|sk-[[:alnum:]]{20,})'; then
            echo "Potential credential material detected" >&2
            exit 1
          fi

      - name: Validate Claude plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.201 plugin validate . --strict
